[project]
name = "pdf-text-extractor"
version = "0.1.7"
description = "Extract and normalize Burmese text from PDFs. Handles Zawgyi-encoded embedded fonts that standard extractors fail on, plus Unicode PDFs where fonts use non-standard character substitutions (e.g., ၄င်း → ၎င်း)."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "you@example.com"}
]
keywords = ["pdf", "zawgyi", "unicode", "burmese", "myanmar", "text-extraction", "font-embedding"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "fpdf2>=2.8.8",
    "fonttools>=4.63.0",
    "ijson>=3.5.1",
    "parquet>=1.3.1",
    "pdfminer.six>=20260107",
    "pillow>=12.3.0",
    "pyarrow>=25.0.1",
    "style>=1.1.0",
    "thriftpy2>=0.7.0",
    "update>=0.0.1",
]

[project.urls]
Homepage = "https://github.com/yourname/zawgyi-pdf-extractor"
Issues = "https://github.com/yourname/zawgyi-pdf-extractor/issues"

[project.scripts]
zawgyi-extract = "zawgyi_pdf_extractor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
